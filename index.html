<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanques em 3D</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--fg:#1c2530;--muted:#5d6b7a;--line:#dde3ea;--accent:#0b6bcb}
  @media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1b222b;--fg:#e8edf2;--muted:#9aa8b6;--line:#2c3540;--accent:#5aa9ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{max-width:1100px;margin:0 auto;padding:32px 16px 8px}
  h1{margin:0 0 4px;font-size:1.8rem}
  header p{margin:0;color:var(--muted)}
  .busca{margin-top:16px;width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
  main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
  .thumb{aspect-ratio:16/10;background:#dfe5ec center/cover no-repeat}
  .info{padding:14px 16px 16px}
  .info h2{margin:0 0 2px;font-size:1.25rem}
  .info p{margin:0;color:var(--muted);font-size:.92rem}
  .abrir{margin-top:10px;color:var(--accent);font-weight:600}
  .msg{grid-column:1/-1;color:var(--muted)}
  footer{max-width:1100px;margin:0 auto;padding:16px 16px 32px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>Tanques em 3D</h1>
  <p>Modelos 3D da planificação de pintura do costado. Clique num tanque para abrir.</p>
  <input class="busca" id="busca" type="search" placeholder="Filtrar por tanque…" aria-label="Filtrar por tanque">
</header>
<main id="lista"><p class="msg">Carregando…</p></main>
<footer id="rodape"></footer>
<script>
const lista = document.getElementById('lista');
let tanques = [];
function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function desenhar(filtro=''){
  const f = filtro.trim().toLowerCase();
  const vis = tanques.filter(t => !f || JSON.stringify(t).toLowerCase().includes(f));
  lista.innerHTML = vis.length ? vis.map(t => `
    <a class="card" href="${esc(t.modelo)}">
      <div class="thumb" style="${t.imagem ? `background-image:url('${esc(t.imagem)}')` : ''}"></div>
      <div class="info">
        <h2>${esc(t.id)}</h2>
        ${t.descricao ? `<p>${esc(t.descricao)}</p>` : ''}
        ${t.desenho ? `<p>Desenho ${esc(t.desenho)}</p>` : ''}
        <div class="abrir">Abrir modelo 3D →</div>
      </div>
    </a>`).join('') : '<p class="msg">Nenhum tanque encontrado.</p>';
}
fetch('tanques.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(d => {
    tanques = d;
    document.getElementById('rodape').textContent = `${d.length} tanque${d.length===1?'':'s'} publicado${d.length===1?'':'s'}.`;
    desenhar();
  })
  .catch(() => lista.innerHTML = '<p class="msg">Não foi possível ler a lista tanques.json.</p>');
document.getElementById('busca').addEventListener('input', e => desenhar(e.target.value));
</script>
</body>
</html>
